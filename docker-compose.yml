services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nse
      POSTGRES_PASSWORD: nse
      POSTGRES_DB: nse_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nse -d nse_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://nse:nse@db:5432/nse_intel
      CORS_ORIGINS: "*"
      USE_MOCK_NSE: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_REFRESH_MS: "30000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
